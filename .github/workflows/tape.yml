name: Tape render

# Draws the Evidence Tape video's frames from the real screens (TapeRender.kt). Runs only on the
# demo-v3 branch. It never builds or publishes the app. Each shot's output goes to its own
# tape-out-<shot> branch (one commit, replaced each run), because the cloud workspace cannot
# download run artifacts.
on:
  push:
    branches: [demo-v3]

permissions:
  contents: write

concurrency:
  group: tape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      shots: ${{ steps.s.outputs.shots }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: echo "shots=$(tr -s ' \n' '\n' < tools/tape-shots.txt | grep . | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  render:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJson(needs.list.outputs.shots) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Render the shot
        run: |
          DEMO_SHOT="${{ matrix.shot }}" ./gradlew testDebugUnitTest --tests "*TapeRender*" --stacktrace > gradle.log 2>&1 || echo "render run failed" >> demo-failures.txt
          tail -n 40 gradle.log
          ls app/build/demo || true
      - name: Pack and put the output on its own branch
        if: always()
        run: |
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
          mkdir -p out
          cp -r app/build/demo/* out/ 2>/dev/null || true
          grep -n "^e: \|error:\|FAILED\|DEMO \|BUILD " gradle.log | head -300 > out/log-summary.txt || true
          tail -n 250 gradle.log > out/gradle-tail.txt || true
          cp demo-failures.txt out/ 2>/dev/null || true
          for x in app/build/test-results/testDebugUnitTest/*TapeRender*.xml; do [ -f "$x" ] && grep -a "DEMO " "$x" | head -2000 > out/demo-prints.txt || true; done
          cd out
          for d in */; do
            d=${d%/}
            if ls "$d"/f_00000.jpg >/dev/null 2>&1; then
              ffmpeg -loglevel error -y -framerate 30 -i "$d/f_%05d.jpg" -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" -c:v libx264 -crf 14 -preset medium -pix_fmt yuv420p "$d/frames.mp4" && rm "$d"/f_*.jpg
            fi
            if [ -f "$d/audio.wav" ]; then ffmpeg -loglevel error -y -i "$d/audio.wav" "$d/audio.flac" && rm "$d/audio.wav"; fi
          done
          git init -q -b "tape-out-${{ matrix.shot }}"
          git config user.name "tape-render" && git config user.email "noreply@github.com"
          git add -A && git commit -q -m "Tape render output, ${{ matrix.shot }}, run ${GITHUB_RUN_NUMBER} [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "tape-out-${{ matrix.shot }}"
