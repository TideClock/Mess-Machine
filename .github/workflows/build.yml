name: Build the app

on:
  push:
    branches: [main]
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quick checks (braces, stale test names, em dashes, guide rewritten)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/precheck.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests (plain Java, no phone needed)
        run: |
          mkdir -p build/enginetest
          javac -d build/enginetest $(find app/src/main/java -name "*.java") tools/EngineTest.java
          java -cp build/enginetest EngineTest app/src/main/assets/sounds/ build/enginetest

      - name: The big test (every screen, with screenshots)
        id: bigtest
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Publish the test screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          cp app/build/screens/*.png app/build/screens/*.md shots/ 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml shots/ 2>/dev/null || true
          (cd shots && zip -q -r ../test-screens.zip .) || true
          if [ -f test-screens.zip ]; then
            gh release delete test-screens --yes --cleanup-tag || true
            gh release create test-screens test-screens.zip --title "Test screenshots" --notes "Screens from build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}). Test outcome: ${{ steps.bigtest.outcome }}." --prerelease
          fi

      - name: Stop here if the big test failed
        if: steps.bigtest.outcome == 'failure'
        run: exit 1

      - name: Build the APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Keep the APK and its symbol map with this run
        uses: actions/upload-artifact@v4
        with:
          name: MessMachine-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt

  phone:
    # the release APK on a real Android emulator: fresh launch, every tab, gestures, long random runs
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MessMachine-apk
          path: built

      - name: Let the emulator use the processor directly
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The phone test
        id: phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 15: edge to edge is enforced here, as on Tyler's phone (MM-9)
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/phone-test.sh $(find built -name app-release.apk | head -1)

      - name: Turn any crash back into readable names
        if: failure()
        run: |
          MAP=$(find built -name mapping.txt | head -1)
          RT=$(ls $ANDROID_HOME/cmdline-tools/*/bin/retrace 2>/dev/null | head -1)
          if [ -n "$RT" ] && [ -s phone-out/crashes.txt ]; then $RT "$MAP" phone-out/crashes.txt | head -150; fi

      - name: Publish the phone test screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd phone-out && zip -q -r ../phone-screens.zip .) || true
          if [ -f phone-screens.zip ]; then
            gh release delete phone-screens --yes --cleanup-tag || true
            gh release create phone-screens phone-screens.zip --title "Phone test" --notes "Emulator run for build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})." --prerelease
          fi

  publish:
    needs: [apk, phone]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MessMachine-apk
          path: built

      - name: Publish the phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp $(find built -name app-release.apk | head -1) MessMachine.apk
          cp $(find built -name mapping.txt | head -1) mapping.txt
          gh release delete latest --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create latest MessMachine.apk mapping.txt -R ${{ github.repository }} \
            --title "Mess Machine, latest build" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Passed the big test and the phone test. On your phone, tap MessMachine.apk below, open it, and allow installs from your browser if Android asks. It installs over the last build and keeps your messes." \
            --prerelease
