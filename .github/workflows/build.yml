name: Build the app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests (plain Java, no phone needed)
        run: |
          mkdir -p build/enginetest
          javac -d build/enginetest $(find app/src/main/java -name "*.java") tools/EngineTest.java
          java -cp build/enginetest EngineTest app/src/main/assets/sounds/ build/enginetest

      - name: The big test (every screen, with screenshots)
        id: bigtest
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Publish the test screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          cp app/build/screens/*.png shots/ 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml shots/ 2>/dev/null || true
          (cd shots && zip -q -r ../test-screens.zip .) || true
          if [ -f test-screens.zip ]; then
            gh release delete test-screens --yes --cleanup-tag || true
            gh release create test-screens test-screens.zip --title "Test screenshots" --notes "Screens from build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}). Test outcome: ${{ steps.bigtest.outcome }}." --prerelease
          fi

      - name: Stop here if the big test failed
        if: steps.bigtest.outcome == 'failure'
        run: exit 1

      - name: Build the APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: MessMachine-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish the phone download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk MessMachine.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MessMachine.apk \
            --title "Mess Machine, latest build" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. On your phone, tap MessMachine.apk below, open it, and allow installs from your browser if Android asks. It installs over the last build and keeps your messes." \
            --prerelease
